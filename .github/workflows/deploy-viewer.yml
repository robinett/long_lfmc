name: Deploy viewer to GCS

on:
  push:
    branches:
      - main
    paths:
      - "lfmc_model/scripts/viewer_3857/**"
      - ".github/workflows/deploy-viewer.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lfmc_model/scripts/viewer_3857/frontend/package-lock.json

      - name: Install dependencies
        working-directory: lfmc_model/scripts/viewer_3857/frontend
        run: npm ci

      - name: Build
        working-directory: lfmc_model/scripts/viewer_3857/frontend
        env:
          VITE_CARTO_BASEMAP_KEY: ${{ secrets.VITE_CARTO_BASEMAP_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Hold index until assets are uploaded
        working-directory: lfmc_model/scripts/viewer_3857/frontend
        run: mv dist/index.html "${RUNNER_TEMP}/viewer-index.html"

      - name: Upload assets to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: lfmc_model/scripts/viewer_3857/frontend/dist
          destination: frontend-long-lfmc
          parent: false
          process_gcloudignore: false

      - name: Restore index
        working-directory: lfmc_model/scripts/viewer_3857/frontend
        run: mv "${RUNNER_TEMP}/viewer-index.html" dist/index.html

      - name: Upload index without caching
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: lfmc_model/scripts/viewer_3857/frontend/dist/index.html
          destination: frontend-long-lfmc
          headers: |-
            cache-control: 'no-store, max-age=0'
